name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode environment
        run: |
          sudo xcode-select -switch /Applications/Xcode_26.3.app
          xcodebuild -version
          xcrun simctl list devices

      - name: Create test directories
        run: |
          mkdir -p TestResults
          mkdir -p Logs

      - name: Build project
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project QaseAPIProj.xcodeproj \
            -scheme QaseAPIProj \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.6' \
            -derivedDataPath DerivedData \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee Logs/build.log

      - name: Run Unit Tests
        run: |
          set -o pipefail
          mkdir -p TestResults/UnitTests
          xcodebuild test \
            -project QaseAPIProj.xcodeproj \
            -scheme QaseAPIProj \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.6' \
            -only-testing:QaseAPIProjTests \
            -resultBundlePath TestResults/UnitTests/UnitTests.xcresult \
            -derivedDataPath DerivedData \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee Logs/unit-tests.log

      - name: Run UI Tests
        run: |
          set -o pipefail
          mkdir -p TestResults/UITests
          xcodebuild test \
            -project QaseAPIProj.xcodeproj \
            -scheme QaseAPIProj \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.6' \
            -only-testing:QaseAPIProjUITests \
            -resultBundlePath TestResults/UITests/UITests.xcresult \
            -derivedDataPath DerivedData \
            -disableAutomaticPackageResolution \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee Logs/ui-tests.log

      - name: Prepare artifacts
        if: always()
        run: |
          mkdir -p TestResults Logs
          cp Logs/*.log TestResults/ 2>/dev/null || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults/
            Logs/
